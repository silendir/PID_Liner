<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PID_Liner · 变体 D · 暗色专业派</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
    gap: 18px;
  }
  .label {
    color: rgba(255,255,255,0.5);
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="label">变体 D · 暗色专业派</div>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ===== 暗色设计 token =====
const color = {
  bg:        '#1a1715',    // 暖暗底（贯彻）
  surface:   '#232020',    // 卡片稍亮一档
  surface2:  '#2d2926',    // 嵌套块再亮一档
  border:    '#3a3431',    // 暖色调细 border（不是冷 zinc）
  accent:    '#f97316',    // 暖橙 accent（贯彻）
  accentDim: 'rgba(249,115,22,0.15)',
  text:      '#fafafa',
  text2:     '#a8a29e',    // 暖灰次要
  text3:     '#78716c',    // 更暗
  muted:     '#52525b',    // 基线曲线暗灰
  yellowBg:  'rgba(245,158,11,0.14)',
  yellowTx:  '#fbbf24',
  greenBg:   'rgba(34,197,94,0.14)',
  greenTx:   '#4ade80',
};
const mono = '"SF Mono", ui-monospace, Menlo, Consolas, monospace';

// ===== IosFrame（screen bg 改暗、status 文字白） =====
const iosFrameStyles = {
  wrapper: { display:'inline-block', padding:12, background:'#000', borderRadius:60, boxShadow:'0 0 0 2px #27272a, 0 20px 60px rgba(0,0,0,0.5)', position:'relative' },
  screen: { position:'relative', borderRadius:48, overflow:'hidden', background: color.bg },
  statusBar: { position:'absolute', top:0, left:0, right:0, height:54, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 32px', fontSize:16, fontWeight:600, fontFamily:'-apple-system, sans-serif', zIndex:20, pointerEvents:'none' },
  dynamicIsland: { position:'absolute', top:12, left:'50%', transform:'translateX(-50%)', width:124, height:36, background:'#000', borderRadius:999, zIndex:30 },
  statusIcons: { display:'flex', alignItems:'center', gap:6 },
  signalIcon: { display:'flex', alignItems:'flex-end', gap:2, height:12 },
  signalBar: { width:3, background:'currentColor', borderRadius:1 },
  batteryIcon: { width:26, height:12, border:'1.5px solid currentColor', borderRadius:3, padding:1, position:'relative', opacity:0.8 },
  batteryCap: { position:'absolute', top:3, right:-3, width:2, height:6, background:'currentColor', borderRadius:'0 1px 1px 0' },
  content: { position:'absolute', top:54, left:0, right:0, bottom:34, overflow:'auto' },
  homeIndicator: { position:'absolute', bottom:10, left:'50%', transform:'translateX(-50%)', width:140, height:5, background:'rgba(255,255,255,0.3)', borderRadius:999, zIndex:10 },
};
function IosFrame({ children, time='9:41', battery=88 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width:393, height:852 }}>
        <div style={{ ...iosFrameStyles.statusBar, color:'#fafafa' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height:4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color:'#fafafa' }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width:String(battery)+'%', height:'100%', background:'currentColor', borderRadius:1, opacity:0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

// ===== 步响应曲线（字符串拼接，不用模板字面量） =====
function stepPath(a, b, c, w, h, samples, yMax) {
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = (i / samples) * 1.6;
    const y = 1 - Math.exp(-a * t) * (Math.cos(b * t) + c * Math.sin(b * t));
    const px = (t / 1.6) * w;
    const py = h - (Math.min(y, yMax) / yMax) * (h - 8) - 4;
    pts.push((i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
  }
  return pts.join(' ');
}

// ===== 顶部 header =====
function Header() {
  return (
    <div style={{ padding: '14px 20px 18px' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div style={{
          fontFamily: mono, fontSize: 22, fontWeight: 700,
          color: color.text, letterSpacing: '-0.01em',
        }}>
          PID_Liner
        </div>
        <div style={{
          fontFamily: mono, fontSize: 10, color: color.text3,
          border: '1px solid ' + color.border, padding: '2px 6px',
          borderRadius: 4, letterSpacing: '0.08em',
        }}>
          v3.3b
        </div>
      </div>
      <div style={{
        fontSize: 13, color: color.text2, marginTop: 4,
        lineHeight: 1.4,
      }}>
        选一条路：看一眼，还是调到底
      </div>
    </div>
  );
}

// ===== 双入口卡 =====
function EntryCard({ title, subtitle, chipBg, chipTx, chipText, chevronColor }) {
  return (
    <div style={{
      flex: 1, background: color.surface, border: '1px solid ' + color.border,
      borderRadius: 10, padding: '12px 12px',
      display: 'flex', flexDirection: 'column', gap: 6,
      cursor: 'pointer',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: color.text }}>{title}</div>
        <div style={{ color: chevronColor, fontFamily: mono, fontSize: 16, lineHeight: 1 }}>›</div>
      </div>
      <div style={{ fontSize: 11, color: color.text2, lineHeight: 1.35 }}>{subtitle}</div>
      <div style={{
        alignSelf: 'flex-start',
        background: chipBg, color: chipTx,
        fontFamily: mono, fontSize: 9.5, fontWeight: 600,
        padding: '2px 6px', borderRadius: 3,
        letterSpacing: '0.1em', marginTop: 2,
      }}>
        {chipText}
      </div>
    </div>
  );
}

function DualEntries() {
  return (
    <div style={{ padding: '0 20px', display: 'flex', gap: 10 }}>
      <EntryCard
        title="独立分析"
        subtitle="导入 BBL · 看曲线出建议"
        chipBg={color.yellowBg}
        chipTx={color.yellowTx}
        chipText="NO-SAVE"
        chevronColor={color.text2}
      />
      <EntryCard
        title="方案迭代"
        subtitle="多轮闭环 · 换参飞→反馈"
        chipBg={color.accentDim}
        chipTx={color.accent}
        chipText="2 ACTIVE"
        chevronColor={color.accent}
      />
    </div>
  );
}

// ===== 分节标题 =====
function SectionTitle() {
  return (
    <div style={{
      padding: '22px 20px 10px',
      display: 'flex', alignItems: 'baseline', justifyContent: 'space-between',
    }}>
      <div style={{
        fontFamily: mono, fontSize: 11, fontWeight: 600,
        color: color.text2, letterSpacing: '0.14em',
      }}>
        // 我的方案
      </div>
      <div style={{ fontFamily: mono, fontSize: 10, color: color.text3 }}>
        2 chains
      </div>
    </div>
  );
}

// ===== 步响应曲线 SVG =====
function CurveChart({ baseline, current, showCurrent, w, h }) {
  const samples = 60, yMax = 1.3;
  const basePts = stepPath(baseline[0], baseline[1], baseline[2], w, h, samples, yMax);
  const curPts = current ? stepPath(current[0], current[1], current[2], w, h, samples, yMax) : null;
  return (
    <svg width={w} height={h} style={{ display: 'block' }}>
      {/* 网格基线 */}
      <line x1="0" y1={h - 4} x2={w} y2={h - 4} stroke={color.border} strokeWidth="1" strokeDasharray="2 3" />
      <line x1="0" y1={h * 0.5} x2={w} y2={h * 0.5} stroke={color.border} strokeWidth="1" strokeDasharray="2 3" opacity="0.5" />
      {/* 1.0 参考线 */}
      <line x1="0" y1={(h - 8) * 0.23 + 4} x2={w} y2={(h - 8) * 0.23 + 4} stroke={color.text3} strokeWidth="0.8" strokeDasharray="1 4" />
      {/* 基线曲线（暗灰） */}
      <path d={basePts} fill="none" stroke={color.muted} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      {/* 当前曲线（accent + glow 签名质感） */}
      {showCurrent && curPts && (
        <path
          d={curPts}
          fill="none" stroke={color.accent} strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round"
          style={{ filter: 'drop-shadow(0 0 4px rgba(249,115,22,0.55))' }}
        />
      )}
    </svg>
  );
}

// ===== 方案卡 =====
function PlanCard({ plan }) {
  return (
    <div style={{
      margin: '0 20px 10px',
      background: color.surface, border: '1px solid ' + color.border,
      borderRadius: 10, padding: 14,
    }}>
      {/* 标题行 */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: color.text }}>
            {plan.name}
          </div>
          <div style={{ fontFamily: mono, fontSize: 10.5, color: color.text3, marginTop: 2 }}>
            {plan.craft} · {plan.fw}
          </div>
        </div>
        <div style={{
          background: plan.statusBg, color: plan.statusTx,
          fontFamily: mono, fontSize: 10, fontWeight: 600,
          padding: '3px 7px', borderRadius: 4, whiteSpace: 'nowrap',
          letterSpacing: '0.04em',
        }}>
          {plan.statusText}
        </div>
      </div>

      {/* 曲线区 */}
      <div style={{
        marginTop: 12, background: color.bg,
        border: '1px solid ' + color.border, borderRadius: 6,
        padding: 8,
      }}>
        <CurveChart
          baseline={plan.baseline}
          current={plan.current}
          showCurrent={plan.current !== null}
          w={312} h={88}
        />
      </div>

      {/* PID 行 + 标注 */}
      <div style={{
        marginTop: 10, display: 'flex', gap: 8, alignItems: 'center',
        fontFamily: mono, fontSize: 11,
      }}>
        <span style={{ color: color.text3 }}>P</span>
        <span style={{ color: color.text2 }}>{plan.pBaseline}</span>
        <span style={{ color: color.text3 }}>→</span>
        <span style={{ color: plan.pDelta ? color.accent : color.text, fontWeight: 600 }}>
          {plan.pCurrent}
        </span>
        {plan.pDelta && (
          <span style={{ color: color.accent, fontSize: 10 }}>{plan.pDelta}</span>
        )}
        <span style={{ flex: 1 }} />
        {plan.alert && (
          <span style={{
            color: color.accent, fontSize: 10,
            background: color.accentDim, padding: '2px 6px',
            borderRadius: 3, border: '1px solid rgba(249,115,22,0.3)',
          }}>
            ! {plan.alert}
          </span>
        )}
      </div>

      {/* 终端式状态行（签名质感） */}
      <div style={{
        marginTop: 8, fontFamily: mono, fontSize: 10, color: color.text3,
        lineHeight: 1.4,
      }}>
        <span style={{ color: color.text2 }}>[chain]</span> {plan.terminal}
      </div>
    </div>
  );
}

// ===== 页脚 =====
function Footer() {
  return (
    <div style={{
      padding: '18px 20px 24px',
      fontSize: 11, color: color.text3, textAlign: 'center',
      lineHeight: 1.5,
    }}>
      🔑 无自动聚合 · 按 chainId 列方案 · craftName 只作显示
    </div>
  );
}

// ===== Screen 根 =====
function Screen() {
  const plans = [
    {
      name: '怪象3.5寸',
      craft: 'SPEEDYBEEF7MINI',
      fw: 'BF4.3.1',
      statusBg: color.yellowBg,
      statusTx: color.yellowTx,
      statusText: '第3轮 · 进行中',
      baseline: [4.0, 9.5, 0.35],
      current: [6.0, 12.0, 0.22],
      pBaseline: 45,
      pCurrent: 49,
      pDelta: '↑',
      alert: 'S3 振荡',
      terminal: '3 sessions · RMSE 0.072 · converged 60%',
    },
    {
      name: '吴bbl 5寸',
      craft: 'MAMBAF722',
      fw: 'BF4.5',
      statusBg: color.greenBg,
      statusTx: color.greenTx,
      statusText: '第5轮 · 已收敛 ✓',
      baseline: [4.5, 8.5, 0.55],
      current: null,
      pBaseline: 38,
      pCurrent: 38,
      pDelta: null,
      alert: null,
      terminal: '5 sessions · RMSE 0.041 · converged 92%',
    },
  ];

  return (
    <div style={{ background: color.bg, minHeight: '100%' }}>
      <Header />
      <DualEntries />
      <SectionTitle />
      {plans.map((p) => (
        <PlanCard key={p.name} plan={p} />
      ))}
      <Footer />
    </div>
  );
}

// ===== 渲染 =====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <IosFrame time="9:41" battery={88}>
    <Screen />
  </IosFrame>
);
</script>
</body>
</html>
