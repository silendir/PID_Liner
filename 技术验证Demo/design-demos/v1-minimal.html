<!DOCTYPE html>

<title>PID_Liner · 变体 A · 极简留白派</title>

<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<body>
  <div class="variant-label">变体 A<span class="sep">·</span>极简留白派</div>
  <div id="root"></div>

<script type="text/babel">
const { useState } = React;

// ============ IosFrame (用户提供,直接复用) ============
const iosFrameStyles = {
  wrapper: { display:'inline-block', padding:12, background:'#000', borderRadius:60, boxShadow:'0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)', position:'relative' },
  screen: { position:'relative', borderRadius:48, overflow:'hidden', background:'#fff' },
  statusBar: { position:'absolute', top:0, left:0, right:0, height:54, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 32px', fontSize:16, fontWeight:600, fontFamily:'-apple-system, sans-serif', zIndex:20, pointerEvents:'none' },
  dynamicIsland: { position:'absolute', top:12, left:'50%', transform:'translateX(-50%)', width:124, height:36, background:'#000', borderRadius:999, zIndex:30 },
  statusIcons: { display:'flex', alignItems:'center', gap:6 },
  signalIcon: { display:'flex', alignItems:'flex-end', gap:2, height:12 },
  signalBar: { width:3, background:'currentColor', borderRadius:1 },
  batteryIcon: { width:26, height:12, border:'1.5px solid currentColor', borderRadius:3, padding:1, position:'relative', opacity:0.8 },
  batteryCap: { position:'absolute', top:3, right:-3, width:2, height:6, background:'currentColor', borderRadius:'0 1px 1px 0' },
  content: { position:'absolute', top:54, left:0, right:0, bottom:34, overflow:'auto' },
  homeIndicator: { position:'absolute', bottom:10, left:'50%', transform:'translateX(-50%)', width:140, height:5, background:'rgba(0,0,0,0.3)', borderRadius:999, zIndex:10 },
};
function IosFrame({ children, time='9:41', battery=88 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width:393, height:852 }}>
        <div style={{ ...iosFrameStyles.statusBar, color:'#000' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height:4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height:11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color:'#000' }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width:String(battery)+'%', height:'100%', background:'currentColor', borderRadius:1, opacity:0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

// ============ 步响应曲线(已验证公式, 字符串拼接非模板字面量) ============
function stepPath(a, b, c, w, h, samples, yMax) {
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = (i / samples) * 1.6;
    const y = 1 - Math.exp(-a * t) * (Math.cos(b * t) + c * Math.sin(b * t));
    const px = (t / 1.6) * w;
    const py = h - (Math.min(y, yMax) / yMax) * (h - 8) - 4;
    pts.push((i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
  }
  return pts.join(' ');
}

// ============ 设计 Token (极简留白派) ============
const T = {
  bg: '#ffffff',
  ink: '#1f2937',          // 主文字 暖墨
  sub: '#6b7280',          // 次要文字
  faint: '#9ca3af',        // 极弱
  hair: '#f1f1ef',         // 发丝级分隔线 暖白偏黄
  accent: '#0d9488',       // 墨绿 accent
  accentDeep: '#0f766e',
  serif: '"New York", "Iowan Old Style", "Apple Garamond", Georgia, "Songti SC", serif',
  sans: '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif',
  // 状态 chip
  chipAmberBg: '#fef3c7', chipAmberFg: '#92400e',
  chipTealBg: '#ccfbf1', chipTealFg: '#0f766e',
  chipGreenBg: '#dcfce7', chipGreenFg: '#166534',
  chipOrangeTag: '#ea580c',
};

// ============ 状态 Chip (无边框圆角小药丸, 仅靠底色区分) ============
function Chip({ bg, fg, children }) {
  return (
    <span style={{
      display: 'inline-block',
      background: bg,
      color: fg,
      fontSize: 11,
      fontWeight: 500,
      padding: '3px 8px',
      borderRadius: 4,
      letterSpacing: '0.01em',
      fontFamily: T.sans,
      whiteSpace: 'nowrap',
    }}>{children}</span>
  );
}

// ============ Hero ============
function Hero() {
  return (
    <div style={{ padding: '28px 28px 22px' }}>
      <div style={{
        fontFamily: T.sans,
        fontSize: 11,
        fontWeight: 600,
        letterSpacing: '0.22em',
        color: T.accent,
        textTransform: 'uppercase',
        marginBottom: 14,
      }}>PID_Liner</div>
      <h1 style={{
        fontFamily: T.serif,
        fontSize: 32,
        fontWeight: 500,
        lineHeight: 1.18,
        color: T.ink,
        margin: 0,
        letterSpacing: '-0.01em',
      }}>
        选一条路<span style={{ color: T.faint, fontWeight: 400 }}>:</span>
        <br />
        <em style={{
          fontStyle: 'italic',
          fontWeight: 400,
          color: T.ink,
        }}>看一眼</em>
        <span style={{ color: T.faint, fontStyle: 'italic', fontWeight: 400, margin: '0 6px' }}>，还是</span>
        <em style={{ fontStyle: 'italic', fontWeight: 400, color: T.accent }}>调到底</em>。
      </h1>
      <p style={{
        fontFamily: T.sans,
        fontSize: 13,
        lineHeight: 1.55,
        color: T.sub,
        margin: '14px 0 0',
        maxWidth: 300,
      }}>
        曲线即产品。每一轮飞行,都让飞机更接近你想要的响应。
      </p>
    </div>
  );
}

// ============ 双入口 Row (Things 风格 · 全宽 · 无边框) ============
function EntryRow({ glyph, glyphColor, title, subtitle, chip, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: 'flex',
        alignItems: 'center',
        gap: 14,
        padding: '16px 28px',
        cursor: 'pointer',
        background: hover ? '#fafafa' : 'transparent',
        transition: 'background 0.15s ease',
      }}
    >
      <div style={{
        width: 32,
        height: 32,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: 18,
        flexShrink: 0,
        color: glyphColor,
        fontFamily: T.serif,
        fontStyle: 'italic',
        fontWeight: 400,
        border: '1px solid ' + T.hair,
        borderRadius: 6,
        background: '#fff',
      }}>{glyph}</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          fontFamily: T.sans,
          fontSize: 15,
          fontWeight: 500,
          color: T.ink,
          marginBottom: 3,
        }}>{title}</div>
        <div style={{
          fontFamily: T.sans,
          fontSize: 12,
          color: T.sub,
          lineHeight: 1.4,
        }}>{subtitle}</div>
      </div>
      <div style={{ flexShrink: 0 }}>{chip}</div>
      <div style={{
        flexShrink: 0,
        fontFamily: T.serif,
        fontSize: 20,
        color: T.faint,
        fontWeight: 300,
        marginLeft: 2,
        lineHeight: 1,
      }}>›</div>
    </div>
  );
}

// ============ 双入口区 ============
function Entries() {
  return (
    <div>
      <div style={{ borderBottom: '1px solid ' + T.hair }}>
        <EntryRow
          glyph="○"
          glyphColor={T.faint}
          title="独立分析"
          subtitle="导入一次 BBL · 看曲线出建议"
          chip={<Chip bg={T.chipAmberBg} fg={T.chipAmberFg}>不保存</Chip>}
        />
      </div>
      <div>
        <EntryRow
          glyph="↻"
          glyphColor={T.accent}
          title="方案迭代"
          subtitle="多轮闭环收敛 · 换参飞→反馈"
          chip={<Chip bg={T.chipTealBg} fg={T.chipTealFg}>2 个进行中</Chip>}
        />
      </div>
    </div>
  );
}

// ============ 迷你曲线 (极细单色线, 80×36) ============
function MiniCurves({ baseline, current, baselineColor, currentColor, w, h }) {
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} style={{ display: 'block' }}>
      {/* baseline 灰色虚线感 (实线但极淡) */}
      <path
        d={stepPath(baseline[0], baseline[1], baseline[2], w, h, 60, 1.4)}
        fill="none"
        stroke={baselineColor}
        strokeWidth={1.2}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
      {/* current 主色 */}
      <path
        d={stepPath(current[0], current[1], current[2], w, h, 60, 1.4)}
        fill="none"
        stroke={currentColor}
        strokeWidth={1.5}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </svg>
  );
}

// ============ 方案 Row (Things task list 风格) ============
function PlanRow({ plan, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        padding: '18px 28px',
        cursor: 'pointer',
        background: hover ? '#fafafa' : 'transparent',
        transition: 'background 0.15s ease',
      }}
    >
      {/* 顶行: 飞机名 + 状态 chip */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        gap: 10,
        marginBottom: 6,
      }}>
        <div style={{
          fontFamily: T.serif,
          fontSize: 16,
          fontWeight: 500,
          color: T.ink,
          letterSpacing: '-0.005em',
          minWidth: 0,
          flex: 1,
        }}>{plan.name}</div>
        {plan.statusChip}
      </div>
      {/* 副行: 飞控 · 固件 */}
      <div style={{
        fontFamily: T.sans,
        fontSize: 12,
        color: T.sub,
        marginBottom: 12,
      }}>
        {plan.fc} · {plan.fw}
      </div>
      {/* 曲线 + P 值 */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        gap: 16,
      }}>
        <div style={{ flexShrink: 0 }}>
          <MiniCurves
            baseline={plan.baseline}
            current={plan.current}
            baselineColor={T.faint}
            currentColor={plan.lineColor}
            w={92}
            h={36}
          />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            display: 'flex',
            alignItems: 'baseline',
            gap: 8,
            marginBottom: 4,
          }}>
            <span style={{
              fontFamily: T.sans,
              fontSize: 11,
              color: T.faint,
            }}>P</span>
            <span style={{
              fontFamily: T.serif,
              fontSize: 13,
              color: T.faint,
              textDecoration: 'line-through',
              textDecorationColor: 'rgba(156,163,175,0.5)',
            }}>{plan.pBaseline}</span>
            <span style={{
              fontFamily: T.serif,
              fontSize: 15,
              color: T.ink,
              fontWeight: 500,
            }}>{plan.pCurrent}</span>
            {plan.pDelta && (
              <span style={{
                fontFamily: T.sans,
                fontSize: 11,
                color: plan.pDeltaColor,
                fontWeight: 500,
              }}>{plan.pDelta}</span>
            )}
          </div>
          <div style={{
            fontFamily: T.sans,
            fontSize: 11,
            color: plan.tagColor,
            fontWeight: 500,
            letterSpacing: '0.01em',
          }}>{plan.tag}</div>
        </div>
        <div style={{
          fontFamily: T.serif,
          fontSize: 18,
          color: T.faint,
          fontWeight: 300,
          lineHeight: 1,
        }}>›</div>
      </div>
    </div>
  );
}

      statusChip: <Chip bg={T.chipGreenBg} fg={T.chipGreenFg}>第 5 轮 · 已收敛 ✓</Chip>,
      baseline: [4.5, 8.5, 0.55],
      current: [4.5, 8.5, 0.55],
      lineColor: T.accentDeep,

      pDeltaColor: T.faint,

  return (

      {/* section header */}
      <div style={{
        display: 'flex',
        alignItems: 'baseline',
        justifyContent: 'space-between',
        padding: '32px 28px 8px',
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <h2 style={{
            fontFamily: T.serif,
            fontSize: 13,
            fontWeight: 600,
            color: T.ink,
            margin: 0,
            letterSpacing: '0.04em',
          }}>我的方案</h2>
          <span style={{
            fontFamily: T.sans,
            fontSize: 12,
            color: T.faint,
          }}>2 个</span>
        </div>
        <div style={{
          display: 'flex',
          alignItems: 'center',
          gap: 4,
          fontFamily: T.sans,
          fontSize: 12,
          color: T.accent,
          fontWeight: 500,
          cursor: 'pointer',
          padding: '4px 0',
        }}>
          <span style={{ fontSize: 14, fontWeight: 300 }}>+</span>
          <span>新建</span>
        </div>
      </div>
      {/* plans list (分隔线分区, 无卡片无边框) */}
      <div style={{
        borderTop: '1px solid ' + T.hair,
      }}>
        <div style={{ borderBottom: '1px solid ' + T.hair }}>
          <PlanRow plan={plans[0]} />
        </div>
        <div>
          <PlanRow plan={plans[1]} />
        </div>
      </div>
    </div>
  );
}

// ============ 页脚提示 ============
function Footer() {
  return (
    <div style={{
      padding: '28px 28px 24px',
      fontFamily: T.sans,
      fontSize: 11,
      color: T.faint,
      lineHeight: 1.7,
      letterSpacing: '0.01em',
    }}>
      <div style={{
        display: 'flex',
        alignItems: 'center',
        gap: 6,
        marginBottom: 6,
      }}>
        <span style={{ fontSize: 11 }}>🔑</span>
        <span>无自动聚合 · 按 chainId 列方案</span>
      </div>
      <div style={{ paddingLeft: 16, fontStyle: 'italic', fontFamily: T.serif, color: T.sub }}>
        craftName 只作显示。
      </div>
    </div>
  );
}

// ============ 屏幕 ============
function HomeScreen() {
  return (
    <div style={{ background: T.bg, minHeight: '100%' }}>
      <Hero />
      <Entries />
      <MyPlans />
      <Footer />
    </div>
  );
}

// ============ App ============
function App() {
  return (
    <IosFrame time="9:41" battery={88}>
      <HomeScreen />
    </IosFrame>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
