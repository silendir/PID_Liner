/* ===== 阶跃响应曲线 (共享) ===== */
function stepPath(a, b, c, w, h, samples, yMax) {
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = (i / samples) * 1.6;
    const y = 1 - Math.exp(-a * t) * (Math.cos(b * t) + c * Math.sin(b * t));
    const px = (t / 1.6) * w;
    const py = h - (Math.min(y, yMax) / yMax) * (h - 8) - 4;
    pts.push((i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
  }
  return pts.join(' ');
}
function StepCurve({ a, b, c, stroke, dash, w, h, label }) {
  w = w || 300; h = h || 120;
  return (
    <svg width={w} height={h} style={{ display:'block' }}>
      {[0.25,0.5,0.75,1.0].map(function(g,i){
        return <line key={i} x1={0} y1={h - g*(h-8) - 4} x2={w} y2={h - g*(h-8) - 4} stroke="#e5e7eb" strokeWidth={1} strokeDasharray="2 3" />;
      })}
      <line x1={0} y1={h-4} x2={w} y2={h-4} stroke="#d1d5db" strokeWidth={1.2} />
      <path d={stepPath(a,b,c,w,h,70,1.05)} fill="none" stroke={stroke} strokeWidth={2.4} strokeDasharray={dash || undefined} strokeLinecap="round" />
      {label ? <text x={w-4} y={14} textAnchor="end" fontSize={10} fill={stroke} fontWeight="600">{label}</text> : null}
    </svg>
  );
}

/* ===== 进度环 (独立分析分支用) ===== */
function ProgressRing({ pct, size=96, stroke=8, color='#0d9488' }) {
  const r=(size-stroke)/2, circ=2*Math.PI*r, off=circ*(1-pct/100);
  return (
    <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" />
    </svg>
  );
}

  return [show, node];
}

function ScreenWorkbench() {
  const [show, toast] = useToast();
  const [showPredict, setShowPredict] = useState(false);
  // 🔑 方案迭代的导入流程:inline loading(不跳页) → sheet → 合并后原地刷新
  // phase: 'idle'(空闲,显示导入按钮) | 'loading'(按钮位置跑进度) | 'sheet'(弹 Session 选择)
  const [phase, setPhase] = useState('idle');
  const [progress, setProgress] = useState(0);
  const [phaseText, setPhaseText] = useState('');
  const [round, setRound] = useState(3);     // 当前轮次(合并后 +1)
  const timerRef = useRef(null);

  const PHASES = [
    { p:15, t:'打开 btfl_new.BBL...' },
    { p:32, t:'提取 4 个 Session...' },
    { p:55, t:'转换 BBL → CSV' },
    { p:78, t:'注入元数据 / 质量门检测' },
    { p:96, t:'就绪 · 选择 Session' },
  ];

  // 点「导入下一轮返参」→ 按钮位置 inline 跑进度(不离开工作台)
  const startImport = function(){
    setPhase('loading'); setProgress(0); setPhaseText(PHASES[0].t);
    let p = 0;
    clearInterval(timerRef.current);
    timerRef.current = setInterval(function(){
      p += 2.5 + Math.random()*3.5;
      const idx = Math.min(PHASES.length-1, Math.floor(p/20));
      setPhaseText(PHASES[idx].t);
      if(p >= 100){
        clearInterval(timerRef.current);
        setProgress(100);
        setTimeout(function(){ setPhase('sheet'); }, 280);  // 完成弹 sheet
      } else {
        setProgress(p);
      }
    }, 110);
  };

  // 合并到本方案 → 关 sheet + 工作台原地刷新(第N轮 → 第N+1)
  const onMerge = function(){
    setPhase('idle'); setProgress(0);
    setRound(function(r){ return r+1; });
    show('✓ 已合并到本方案 · 进入第' + (round+1) + '轮');
  };
  const onDiscard = function(){ setPhase('idle'); setProgress(0); show('已丢弃 · 不写入链'); };
  const onFork    = function(){ setPhase('idle'); setProgress(0); show('已另立新方案(chainId)'); };

  useEffect(function(){ return function(){ clearInterval(timerRef.current); }; }, []);

  // 轮次数据(随 round 刷新,体现"原地刷新"而非跳页)
  const STAGES = {
    3: { chip:'第3轮 • 进行中', base:45, prev:45, prevLabel:'第2轮', cur:49, curLabel:'当前•第3轮', rec:47, recLabel:'推荐•第4轮', cc:{a:6.0,b:12,c:0.22}, cr:{a:5.4,b:9,c:0.42}, cli:'set simplified_pids_mode = RPY\nset simplified_master_multiplier = 100\nset simplified_pi_gain = 100\nset simplified_d_gain = 117\nset simplified_feedforward_gain = 0' },
    4: { chip:'第4轮 • 进行中', base:45, prev:49, prevLabel:'第3轮', cur:47, curLabel:'当前•第4轮', rec:47, recLabel:'推荐•第5轮', cc:{a:5.4,b:9,c:0.42}, cr:{a:5.6,b:10.5,c:0.30}, cli:'set simplified_pids_mode = RPY\nset simplified_master_multiplier = 100\nset simplified_pi_gain = 95\nset simplified_d_gain = 115\nset simplified_feedforward_gain = 0' },
  };
  const s = STAGES[round] || STAGES[4];

  return (
    <div className="scr"><div className="scr-pad">
      <div className="nav-bar">
        <div className="nav-back">‹</div>
        <div className="nav-title">怪象3.5寸</div>
        <div className="nav-badge iter">方案迭代</div>
      </div>
      <div className="card" style={{padding:'14px 16px'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
          <span className="chip prog">{s.chip}</span>
          <span className="muted" style={{fontSize:11}}>SPEEDYBEEF7MINI • BF4.3.1</span>
        </div>
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', fontSize:13}}>
          <div style={{textAlign:'center'}}><div className="muted" style={{fontSize:10}}>基线</div><div style={{fontWeight:700, fontSize:16}}>P{s.base}</div></div>
          <div className="muted">→</div>
          <div style={{textAlign:'center'}}><div className="muted" style={{fontSize:10}}>{s.prevLabel}</div><div style={{fontWeight:700, fontSize:16}}>P{s.prev}</div></div>
          <div className="muted">→</div>
          <div style={{textAlign:'center'}}><div style={{fontSize:10, color:'#0d9488'}}>{s.curLabel}</div><div style={{fontWeight:700, fontSize:16, color:'#0d9488'}}>P{s.cur}</div></div>
          <div className="muted">→</div>
          <div style={{textAlign:'center'}}><div style={{fontSize:10, color:'#ea580c'}}>{s.recLabel}</div><div style={{fontWeight:700, fontSize:16, color:'#ea580c'}}>P{s.rec}</div></div>
        </div>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', margin:'14px 4px 8px'}}>
        <div style={{fontSize:12, fontWeight:700, color:'#6b7280'}}>曲线对比 • roll</div>
        <div className="accent" style={{fontSize:12, cursor:'pointer', fontWeight:600}} onClick={function(){ setShowPredict(!showPredict); }}>
          {showPredict ? '− 隐藏预测' : '+ 显示预测虚线'}
        </div>
      </div>
      <div className="card">
        <div style={{position:'relative'}}>
          <StepCurve a={CB.a} b={CB.b} c={CB.c} stroke="#9ca3af" w={324} h={140} label="基线 S1" />
          <div style={{position:'relative', marginTop:-140}}>
            <StepCurve a={s.cc.a} b={s.cc.b} c={s.cc.c} stroke="#0d9488" w={324} h={140} label={'当前 S'+round} />
          </div>
          {showPredict ? (
            <div style={{position:'relative', marginTop:-140}}>
              <StepCurve a={s.cr.a} b={s.cr.b} c={s.cr.c} stroke="#ea580c" dash="6 4" w={324} h={140} label={'预测 S'+(round+1)} />
            </div>
          ) : null}
        </div>
      </div>
      <div style={{fontSize:12, fontWeight:700, color:'#6b7280', margin:'14px 4px 8px'}}>第{s.recLabel.match(/\d+/)[0]}轮推荐 • 滑块 CLI</div>
      <div className="card">
        <div className="cli-block">{s.cli}</div>
        <button className="btn btn-ghost" style={{marginTop:8}} onClick={function(){ show('已复制 CLI'); }}>复制 CLI</button>
      </div>

      {/* 🔑 导入区:三态 inline 切换(不跳页) */}
      {phase==='idle' && (
        <button className="btn btn-primary" style={{marginTop:6}} onClick={startImport}>导入下一轮返参 →</button>
      )}
      {phase==='loading' && (
        <div className="card" style={{marginTop:6, padding:'12px 14px'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
            <span style={{fontSize:12.5, fontWeight:700}}>⟳ 导入 btfl_new.BBL</span>
            <span className="accent" style={{fontSize:13, fontWeight:700, fontFamily:'SF Mono,Menlo,monospace'}}>{Math.round(progress)}%</span>
          </div>
          <div style={{width:'100%', height:6, background:'#e5e7eb', borderRadius:999, overflow:'hidden'}}>
            <div style={{width:String(progress)+'%', height:'100%', background:'#0d9488', borderRadius:999, transition:'width .12s'}} />
          </div>
          <div className="muted" style={{fontSize:11, marginTop:6}}>{phaseText}</div>
        </div>
      )}
      <div className="tap-hint">🔑 isIter=YES · 点「导入下一轮」看 inline loading → sheet → 合并后原地刷新轮次</div>

      {phase==='sheet' && <InteractiveSessionSheet onMerge={onMerge} onDiscard={onDiscard} onFork={onFork} />}
      {toast}
    </div></div>
  );
}
