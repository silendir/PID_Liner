/* ===== 步响应曲线 ===== */
function stepPath(a, b, c, w, h, samples, yMax) {
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = (i / samples) * 1.6;
    const y = 1 - Math.exp(-a * t) * (Math.cos(b * t) + c * Math.sin(b * t));
    const px = (t / 1.6) * w;
    const py = h - (Math.min(y, yMax) / yMax) * (h - 8) - 4;
    pts.push((i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
  }
  return pts.join(' ');
}
function StepCurve({ a, b, c, stroke, dash, w, h, label }) {
  w = w || 300; h = h || 120;
  return (
    <svg width={w} height={h} style={{ display:'block' }}>
      {[0.25,0.5,0.75,1.0].map(function(g,i){
        return <line key={i} x1={0} y1={h - g*(h-8) - 4} x2={w} y2={h - g*(h-8) - 4} stroke="#e5e7eb" strokeWidth={1} strokeDasharray="2 3" />;
      })}
      <line x1={0} y1={h-4} x2={w} y2={h-4} stroke="#d1d5db" strokeWidth={1.2} />
      <path d={stepPath(a,b,c,w,h,70,1.05)} fill="none" stroke={stroke} strokeWidth={2.4} strokeDasharray={dash || undefined} strokeLinecap="round" />
      {label ? <text x={w-4} y={14} textAnchor="end" fontSize={10} fill={stroke} fontWeight="600">{label}</text> : null}
    </svg>
  );
}

/* ===== Toast hook ===== */
function useToast() {
  const [msg, setMsg] = useState(null);
  const show = function(m){ setMsg(m); setTimeout(function(){ setMsg(null); }, 1600); };
  const node = msg ? <div className="toast">{msg}</div> : null;
  return [show, node];
}

      <div className="card">
        <div style={{fontSize:12, marginBottom:8}}>
          <span className="warn">S3 振荡</span> • 反解建议 <span className="accent" style={{fontWeight:600}}>pi_gain 109 → 100</span>(回调) + d_gain +5
        </div>
        <div className="cli-block">{'set simplified_pids_mode = RPY\nset simplified_master_multiplier = 100\nset simplified_pi_gain = 100\nset simplified_d_gain = 117\nset simplified_feedforward_gain = 0'}</div>
        <button className="btn btn-ghost" style={{marginTop:8}} onClick={function(){ show('已复制 CLI • 拿去 BF 粘贴'); }}>复制 CLI</button>
      </div>

      <button className="btn btn-primary" style={{marginTop:6}} onClick={function(){ setSheetOpen(true); }}>导入下一轮返参 →</button>
      <div className="tap-hint">飞手换参飞后,导新 BBL → 弹 Session 选择</div>

      {sheetOpen ? <SessionSheet onClose={function(){ setSheetOpen(false); show('已合并到本方案 • 第4轮曲线接入'); }} /> : null}
      {toast}
    </div></div>
  );
}

/* ===== 屏4 Session 选择 sheet ===== */
function SessionSheet({ onClose }) {
  const [sel, setSel] = useState(1);
  const sessions = [
    { id:0, t:'02:14', pid:'P45/80/30 FF0', q:'✓ 阶跃' },
    { id:1, t:'03:42', pid:'P49/88/30 FF0', q:'✓ 阶跃 • 振荡' },
    { id:2, t:'01:08', pid:'P45/80/30 FF0', q:'⚠ 非阶跃' },
    { id:3, t:'04:25', pid:'P45/80/35 FF0', q:'✓ 阶跃' },
  ];
  return (
    <div className="sheet-mask" onClick={onClose}>
      <div className="sheet" onClick={function(e){ e.stopPropagation(); }}>
        <div className="sheet-handle" />
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div style={{fontSize:16, fontWeight:700}}>导入 btfl_new.BBL</div>
          <div className="muted" style={{fontSize:12}}>4 个 Session</div>
        </div>
        <div className="muted" style={{fontSize:12, marginBottom:14}}>选择一个 Session • 用户主动决定去留</div>

        {sessions.map(function(s){
          return (
            <div key={s.id} className={'sess-row' + (sel===s.id?' sel':'')} onClick={function(){ setSel(s.id); }}>
              <div className="sess-mini">
                <StepCurve a={s.id===2?2:5+s.id*0.3} b={s.id===1?13:9.5} c={s.id===1?0.2:0.4} stroke={sel===s.id?'#0d9488':'#9ca3af'} w={56} h={32} />
              </div>
              <div className="sess-info">
                <div className="t">Session {s.id+1} <span className="muted" style={{fontWeight:400, fontSize:11}}>• {s.t}</span></div>
                <div className="s">{s.pid}</div>
                <div className="s" style={{color: s.q.indexOf('⚠')>=0 ? '#ea580c' : '#0f766e'}}>{s.q}</div>
              </div>
              <div className={'sess-radio' + (sel===s.id?' on':'')} />
            </div>
          );
        })}

        <div style={{display:'flex', gap:8, marginTop:14}}>
          <button className="btn btn-secondary" style={{flex:1}} onClick={onClose}>丢弃</button>
          <button className="btn btn-secondary" style={{flex:1}} onClick={onClose}>另立新方案</button>
          <button className="btn btn-primary" style={{flex:1.3}} onClick={onClose}>合并到本方案</button>
        </div>
        <div className="tap-hint">🔑 三选一 • 不自动合并 • 不自动聚合</div>
      </div>
    </div>
  );
}

/* ===== 屏4 静态展示态 ===== */
function ScreenSheet() {
  const sessions = [
    { id:0, t:'02:14', pid:'P45/80/30 FF0', q:'✓ 阶跃' },
    { id:1, t:'03:42', pid:'P49/88/30 FF0', q:'✓ 阶跃 • 振荡' },
    { id:2, t:'01:08', pid:'P45/80/30 FF0', q:'⚠ 非阶跃' },
    { id:3, t:'04:25', pid:'P45/80/35 FF0', q:'✓ 阶跃' },
  ];
  return (
    <div className="scr">
      <div className="scr-pad" style={{opacity:0.5, filter:'blur(1px)'}}>
        <div className="nav-bar">
          <div className="nav-back">‹</div>
          <div className="nav-title">怪象3.5寸</div>
          <div className="nav-badge iter">方案迭代</div>
        </div>
        <div className="card" style={{padding:'14px 16px'}}>
          <span className="chip prog">第3轮 • 进行中</span>
        </div>
      </div>
      <div className="sheet-mask">
        <div className="sheet">
          <div className="sheet-handle" />
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div style={{fontSize:16, fontWeight:700}}>导入 btfl_new.BBL</div>
            <div className="muted" style={{fontSize:12}}>4 个 Session</div>
          </div>
          <div className="muted" style={{fontSize:12, marginBottom:14}}>选择一个 Session • 用户主动决定去留</div>
          {sessions.map(function(s,i){
            return (
              <div key={s.id} className={'sess-row' + (i===1?' sel':'')}>
                <div className="sess-mini">
                  <StepCurve a={i===2?2:5+i*0.3} b={i===1?13:9.5} c={i===1?0.2:0.4} stroke={i===1?'#0d9488':'#9ca3af'} w={56} h={32} />
                </div>
                <div className="sess-info">
                  <div className="t">Session {s.id+1} <span className="muted" style={{fontWeight:400, fontSize:11}}>• {s.t}</span></div>
                  <div className="s">{s.pid}</div>
                  <div className="s" style={{color: s.q.indexOf('⚠')>=0 ? '#ea580c' : '#0f766e'}}>{s.q}</div>
                </div>
                <div className={'sess-radio' + (i===1?' on':'')} />
              </div>
            );
          })}
          <div style={{display:'flex', gap:8, marginTop:14}}>
            <button className="btn btn-secondary" style={{flex:1}}>丢弃</button>
            <button className="btn btn-secondary" style={{flex:1}}>另立新方案</button>
            <button className="btn btn-primary" style={{flex:1.3}}>合并到本方案</button>
          </div>
          <div className="tap-hint">🔑 三选一 • 不自动合并 • 不自动聚合</div>
        </div>
      </div>
    </div>
  );
}

/* ===== App ===== */

  return (
    <div>
      <div className="page-title">拟合闭环 • 4 屏可交互原型</div>
      <div className="page-sub">
        验证 <b>用户主动方案制</b> UX 假设:默认独立分析(回退 1.1 前 1对1 干净版)+ 用户主动建方案 + 主动合并 Session。砍掉"自动按 craftName 聚合"的毒。每台独立可点 —— 点屏1 卡片看跳转提示 / 屏3"显示预测虚线" / 屏3"导入下一轮"弹 Session sheet。

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
