/* ===== 设计 token(墨绿系,与第一版一致;曲线色定义不动) ===== */
const C = {

  line: '#e5e7eb', lineSoft: '#f1f5f9',

  accentSoft: '#ccfbf1', accentDeep: '#0f766e',
  warn: '#ea580c',         // 推荐橙虚 / 振荡

  ok: '#166534',           // 收敛绿

  yellowSoft: '#fef3c7', yellowText: '#92400e',

/* 曲线色定义(第一版,钉死不动) */

/* ===== 步响应曲线(二阶:1 - e^-at*(cos bt + c sin bt)) ===== */
function stepPath(a, b, c, w, h, samples, yMax) {
  const pts = [];
  for (let i = 0; i <= samples; i++) {
    const t = (i / samples) * 1.6;
    const y = 1 - Math.exp(-a * t) * (Math.cos(b * t) + c * Math.sin(b * t));
    const px = (t / 1.6) * w;
    const py = h - (Math.min(y, yMax) / yMax) * (h - 8) - 4;
    pts.push((i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
  }
  return pts.join(' ');
}
function GridLines({ w, h }) {
  return (
    <g>
      {[0.25,0.5,0.75,1.0].map(function(r,i){
        return <line key={i} x1={0} y1={h - r*(h-8) - 4} x2={w} y2={h - r*(h-8) - 4} stroke={C.faint} strokeWidth={0.5} strokeDasharray="2,3" opacity="0.55" />;
      })}
    </g>
  );
}
/* 标准曲线组件(网格 + 可选多层曲线) */
function CurveChart({ w, h, layers, showAxis }) {
  w = w || 300; h = h || 130;
  return (
    <svg width="100%" viewBox={'0 0 '+w+' '+h} preserveAspectRatio="none" style={{ display:'block' }}>
      <GridLines w={w} h={h} />
      <line x1={0} y1={h-4} x2={w} y2={h-4} stroke={C.line} strokeWidth={1} />
      {layers.map(function(L,i){
        const p = stepPath(L.a, L.b, L.c, w, h, 80, 1.1);
        const fill = L.fill ? p + ' L'+w+','+h+' L0,'+h+' Z' : null;
        return (
          <g key={i}>
            {fill ? <path d={fill} fill={L.stroke} opacity="0.08" /> : null}
            <path d={p} fill="none" stroke={L.stroke} strokeWidth={L.w || 2} strokeDasharray={L.dash || undefined} strokeLinecap="round" />
            {L.label ? <text x={w-4} y={13} textAnchor="end" fontSize={9} fill={L.stroke} fontWeight="700">{L.label}</text> : null}
          </g>
        );
      })}
      {showAxis ? (
        <g className="mono">
          {[0,0.4,0.8,1.2,1.6].map(function(t,i){
            return <text key={i} x={(t/1.6)*w} y={h-1} textAnchor={i===0?'start':(i===4?'end':'middle')} fontSize={7.5} fill={C.faint}>{t}s</text>;
          })}
        </g>
      ) : null}
    </svg>
  );
}
/* 进度环(收敛度) */
function ProgressRing({ pct, size=22, stroke=3, color }) {
  color = color || (pct >= 100 ? C.ok : C.accent);
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const off = circ * (1 - pct/100);
  return (
    <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.line} strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" />
    </svg>
  );
}

/* ===== 通用 UI ===== */
function NavBar({ title, badge, badgeTone, onBack }) {

    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 16px 12px' }}>
      <div onClick={onBack} style={{ fontSize:22, color:C.accent, cursor:'pointer', width:28, lineHeight:1 }}>‹</div>
      <div style={{ fontSize:16, fontWeight:600, color:C.ink }}>{title}</div>
      {badge ? <span style={{ fontSize:10, padding:'3px 8px', borderRadius:999, background:tone.bg, color:tone.color, fontWeight:600, letterSpacing:0.3 }}>{badge}</span> : <div style={{width:28}} />}
    </div>
  );
}
function Card({ children, pad }) {
  return <div style={{ background:C.card, borderRadius:12, border:'1px solid '+C.line, boxShadow:'0 1px 2px rgba(15,23,42,0.04)', padding: pad || '14px' }}>{children}</div>;
}
function Chip({ children, tone }) {
  const t = tone === 'prog' ? { bg:C.yellowSoft, color:C.yellowText }
          : tone === 'done' ? { bg:C.okSoft, color:C.ok }
          : tone === 'iter' ? { bg:C.accentSoft, color:C.accentDeep }
          : tone === 'warn' ? { bg:C.warnSoft, color:C.warnText }
          : { bg:C.lineSoft, color:C.sub };
  return <span style={{ fontSize:10.5, fontWeight:600, padding:'3px 8px', borderRadius:999, background:t.bg, color:t.color, letterSpacing:0.2, whiteSpace:'nowrap' }}>{children}</span>;
}
function SectionLabel({ children, right }) {
  return (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', margin:'14px 16px 8px' }}>
      <span style={{ fontSize:11.5, fontWeight:700, color:C.sub, letterSpacing:0.4 }}>{children}</span>
      {right || null}
    </div>
  );
}
function Btn({ children, kind, onClick, style }) {
  const s = kind === 'primary' ? { background:C.accent, color:'#fff' }
          : kind === 'ghost' ? { background:'transparent', color:C.accent, padding:'10px' }
          : { background:C.lineSoft, color:C.ink };
  return <button onClick={onClick} style={{ display:'block', width:'100%', padding:'13px', border:'none', borderRadius:12, fontSize:14.5, fontWeight:600, cursor:'pointer', textAlign:'center', fontFamily:'inherit', ...s, ...style }}>{children}</button>;
}
function CliBlock({ text }) {
  return <pre className="mono" style={{ fontSize:11.5, lineHeight:1.7, background:'#0f172a', color:'#e2e8f0', padding:12, borderRadius:10, whiteSpace:'pre', overflowX:'auto', margin:0 }}>{text}</pre>;
}
/* KPI 单元(仪表盘小格) */
function Kpi({ label, value, sub, color, ring }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
      <div style={{ fontSize:9, color:C.faint, letterSpacing:0.4, fontWeight:600 }}>{label}</div>
      <div style={{ display:'flex', alignItems:'center', gap:4, marginTop:1 }}>
        {ring ? <ProgressRing pct={ring} /> : null}
        <span className="mono" style={{ fontSize:14, fontWeight:700, color: color || C.ink }}>{value}</span>
        {sub ? <span style={{ fontSize:10, color:C.faint, fontWeight:500 }}>{sub}</span> : null}
      </div>
    </div>
  );
}
function KpiRow({ items }) {
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat('+items.length+', 1fr)', gap:0, borderTop:'1px solid '+C.lineSoft, borderBottom:'1px solid '+C.lineSoft, padding:'9px 0' }}>
      {items.map(function(it,i){
        return <div key={i} style={{ borderRight: i<items.length-1 ? '1px solid '+C.lineSoft : 'none', paddingRight:6, paddingLeft: i===0 ? 0 : 6 }}><Kpi {...it} /></div>;
      })}
    </div>
  );
}

/* ===== Toast hook ===== */
function useToast() {
  const [msg, setMsg] = useState(null);
  const show = function(m){ setMsg(m); setTimeout(function(){ setMsg(null); }, 1500); };
  const node = msg ? <div className="toast">{msg}</div> : null;
  return [show, node];
}
