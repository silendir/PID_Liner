<!doctype html>
<html lang="en" data-framework="javascript">

<head>
  <title>闪码发送器 Cimbar Send</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
</head>

<body>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
    }

    body {
      background-color: white;
      background-image: linear-gradient(135deg, rgb(0, 0, 0) 65px, transparent 130px),
        repeating-linear-gradient(135deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px),
        repeating-linear-gradient(45deg, rgb(0, 0, 0) 0px, rgb(153, 197, 206) 1px, transparent 1px, transparent 30px);
      background-size: cover;
      color: gray;
      display: grid;
      align-items: center;
      transition: opacity 0.4s ease-in;
    }

    #status {
      position: fixed;
      right: 0;
      top: 0;
    }

    #nav-container:focus-within {
      z-index: 1;
    }

    #nav-content,
    #nav-container .bg,
    #nav-container:focus-within #nav-button {
      z-index: 1;
    }

    #canvas {
      display: block;
      position: relative;
    }

    #dragdrop {
      background-color: #3C3D82;
      background-image: linear-gradient(135deg, rgba(249, 249, 249, 0.1) 0%, rgba(249, 249, 249, 0.1) 18%, rgba(70, 70, 70, 0.1) 18%, rgba(70, 70, 70, 0.1) 33%, rgba(229, 229, 229, 0.1) 33%, rgba(229, 229, 229, 0.1) 35%, rgba(53, 53, 53, 0.1) 35%, rgba(53, 53, 53, 0.1) 47%, rgba(156, 156, 156, 0.1) 47%, rgba(156, 156, 156, 0.1) 100%), linear-gradient(135deg, rgba(106, 106, 106, 0.08) 0%, rgba(106, 106, 106, 0.08) 9%, rgba(123, 123, 123, 0.08) 9%, rgba(123, 123, 123, 0.08) 10%, rgba(69, 69, 69, 0.08) 10%, rgba(69, 69, 69, 0.08) 38%, rgba(33, 33, 33, 0.08) 38%, rgba(33, 33, 33, 0.08) 65%, rgba(24, 24, 24, 0.08) 24%, rgba(210, 210, 210, 0.08) 77%, rgba(250, 250, 250, 0.08) 90%, rgba(91, 91, 91, 0.08) 100%);
      margin: 0 auto;
      color: #F0F0F0;
      outline: 6px solid black;
      box-shadow: 0px 0px 12px black, 0px 0px 18px black;
    }

    .dragdrop::before {
      content: "⌜ Tap to start! ⌟";
      font: 1.5em serif;
      padding-top: 2em;
      position: absolute;
      left: 0;
      text-align: center;
      width: 100%;
    }

    .dragdrop.error:before {
      content: "⌜ Error! WebGL is not enabled :( ⌟";
    }

    #invisible_click {
      position: fixed;
      opacity: 0;
      pointer-events: auto;
    }

    #invisible_click.active {
      cursor: none;
    }

    #nav-container:focus-within+#invisible_click {
      pointer-events: none;
      display: none;
    }

    /* ===== 文本发送面板 ===== */
    #text-panel {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }

    #text-panel.hidden {
      display: none;
    }

    #text-card {
      width: min(92vw, 480px);
      background: #282C34;
      color: #eee;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
    }

    #text-card h3 {
      font-variant: small-caps;
      margin-bottom: 8px;
      color: #9fa6b2;
    }

    #text-input {
      width: 100%;
      height: 40vh;
      box-sizing: border-box;
      resize: none;
      background: #1b1e24;
      color: #eee;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
    }

    #text-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #text-row button {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    #btn-open-file {
      background: #4a5160;
      color: #fff;
    }

    #btn-paste {
      background: #3C3D82;
      color: #fff;
    }

    #btn-send-text {
      background: #007764;
      color: #fff;
      font-weight: bold;
    }

    #text-hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* options */
    #nav-container a.mode-b,
    #nav-container a.mode-bm,
    #nav-container a.mode-bu,
    #nav-container a.mode-4c {
      color: #555;
    }

    #nav-container.mode-b a.mode-b,
    #nav-container.mode-bm a.mode-bm,
    #nav-container.mode-bu a.mode-bu,
    #nav-container.mode-4c a.mode-4c {
      color: #9fa6b2;
    }

    /* nav stuff */
    /* built off of https://codepen.io/dannievinther/pen/NvZjvz */
    #nav-container {
      position: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #nav-container .bg {
      pointer-events: auto;
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      transition: .3s;
      background: black;
    }

    #nav-container:focus-within .bg {
      visibility: visible;
      opacity: .6;
    }

    #nav-container * {
      visibility: visible;
    }

    #nav-button {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 60px;
      width: 30px;
      margin-left: 15px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      border: 0;
      outline: 0;
      background-image: linear-gradient(180deg, rgb(0, 0, 0, 0) 10%, rgb(0, 0, 0) 40%, rgb(0, 0, 0) 60%, rgb(0, 0, 0, 0) 90%);
      background-color: initial;
    }

    #nav-button.hide {
      opacity: 0;
      transition: .3s;
    }

    #nav-container:focus-within #nav-button.hide {
      opacity: 1;
    }

    .icon-bar {
      display: block;
      width: 100%;
      height: 3px;
      transition: .3s;
    }

    .icon-bar+.icon-bar {
      margin-top: 3px;
    }

    #nav-container .icon-bar:nth-of-type(1) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container .icon-bar:nth-of-type(3) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(1) {
      background-color: #00ffff;
      box-shadow: 0px 0px 5px #00ffff, 0px 0px 2px #00ffff;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(2) {
      background-color: #ffff00;
      box-shadow: 0px 0px 5px #ffff00, 0px 0px 2px #ffff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(3) {
      background-color: #00ff00;
      box-shadow: 0px 0px 5px #00ff00, 0px 0px 2px #00ff00;
    }

    #nav-container.mode-4c .icon-bar:nth-of-type(4) {
      background-color: #ff00ff;
      box-shadow: 0px 0px 5px #ff00ff, 0px 0px 2px #ff00ff;
    }

    #nav-container:focus-within #nav-button {
      pointer-events: none;
    }

    #nav-container:focus-within .icon-bar {
      background-color: #aaa;
      background-image: none !important;
      box-shadow: none !important;
    }

    #nav-button.attention:focus-within .icon-bar {
      background-color: #00ffff;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(1) {
      transform: translate3d(0, 9px, 0) rotate(45deg);
    }

    #nav-container:focus-within .icon-bar:nth-of-type(2),
    #nav-container:focus-within .icon-bar:nth-of-type(3) {
      opacity: 0;
    }

    #nav-container:focus-within .icon-bar:nth-of-type(4) {
      transform: translate3d(0, -9px, 0) rotate(-45deg);
    }

    #nav-content {
      margin-top: 60px;
      padding: 20px;
      position: absolute;
      top: 0;
      left: 0;
      height: calc(100% - 60px);
      overflow-x: clip;
      background-color: #282C34;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      transform: translateX(-100%);
      transition: transform .3s;
    }

    #nav-content ul {
      height: calc(100% - 60px);
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    #nav-content hr {
      border: 1px solid #444;
    }

    #nav-content li a {
      display: block;
      padding: 10px 5px;
      color: #9fa6b2;
      text-decoration: none;
      transition: color .1s;
    }

    #nav-content li a.attention {
      animation: glowing 1.5s infinite alternate;
    }

    #nav-content li a {
      font-variant: small-caps;
      font-size: 2em;
    }

    #nav-content h4 {
      font-variant: small-caps;
      padding-top: 1em;
    }

    #nav-content li.modesel a {
      display: inline-block;
      width: 2em;
    }

    #nav-content li:hover {
      background-color: #2c323c;
    }

    #nav-content li:not(.small)+.small {
      margin-top: auto;
    }

    #nav-content li.small {
      display: flex;
      align-self: center;
    }

    #nav-content li.small a {
      font-size: 1em;
    }

    #nav-content li .range {
      margin-top: 0.6em;
      width: 100%;
    }

    #nav-container:focus-within #nav-content {
      transform: none;
    }

    @keyframes glowing {
      0% {
        color: #00ffff;
      }
    }
  </style>

  <div id="status"></div>
  <div id="dragdrop" class="dragdrop" title="Drag and drop a file">
    <canvas id="canvas" class="canvas"></canvas>
  </div>

  <input style="display:none;" type="file" name="file_input" id="file_input" onchange="Main.fileInput(this);" />

  <a id="invisible_click" href="javascript:;" onclick="Main.clickNav()"></a>

  <!-- 文本发送面板 -->
  <div id="text-panel">
    <div id="text-card">
      <h3>⌨️ 发送文本 / 剪贴板</h3>
      <textarea id="text-input" placeholder="在这里粘贴或输入要发送的文本…&#10;(接收端收到纯文本会自动放进剪贴板)"></textarea>
      <div id="text-row">
        <button id="btn-open-file" onclick="TextSend.openFile()">📂 打开文件</button>
        <button id="btn-paste" onclick="TextSend.paste()">📋 读剪贴板</button>
        <button id="btn-send-text" onclick="TextSend.send()">🚀 发送文本</button>
      </div>
      <div id="text-hint">「读剪贴板」在非 HTTPS 页面可能无效,可在输入框长按→粘贴。<br>发文件:「打开文件」按钮或直接拖拽进来。</div>
    </div>
  </div>

  <div id="nav-container" class="mode-b">
    <div class="bg" onclick="Main.blurNav();"></div>
    <button id="nav-button" tabindex="0" onclick="Main.clickNav();">
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
      <span class="icon-bar"></span>
    </button>
    <div id="nav-content" tabindex="-1">
      <span id="current-file">No file selected</span>
      <ul>
        <li><a href="javascript:void(0)" onclick="TextSend.show()">Send Text 发送文本</a></li>
        <li><a class="attention" id="nav-find-file-link" href="javascript:void(0)" onclick="Main.clickFileInput()">Find
            File</a></li>
        <hr>
        <li class="modesel">
          <h4>Mode</h4>
          <a class="mode-b" href="javascript:void(0)" onclick="Main.setMode('B')">B</a>
          <a class="mode-bm" href="javascript:void(0)" onclick="Main.setMode('Bm')">Bm</a>
          <a class="mode-bu" href="javascript:void(0)" onclick="Main.setMode('Bu')">Bu</a>
          <a class="mode-4c" href="javascript:void(0)" onclick="Main.setMode('4C')">4C</a>
        </li>
        <li>
          <h4>Framerate</h4>
          <input type="range" class="range" min="5" max="20" step="5" value="15" oninput="Main.setFPS(this.value)"
            onchange="Main.setFPS(this.value)" />
        </li>
        <li class="small"><a href="javascript:void(0)" onclick="Main.toggleFullscreen()">Fullscreen</a></li>
        <li class="small"><a href="https://github.com/sz3/libcimbar">github</a></li>
        <li class="small"><a href="https://github.com/sz3/cfc/releases/latest">android app</a></li>
      </ul>
    </div>
  </div>

  <script src="send.2026-07-13T0523.js"></script>
  <script src="main.2026-07-13T0523.js"></script>

  <script type="text/javascript">
    var TextSend = function () {
      function wasmReady() {
        return typeof Module !== 'undefined' && !!Module._cimbare_encode;
      }
      return {
        show: function () {
          document.getElementById('text-panel').classList.remove('hidden');
        },
        hide: function () {
          document.getElementById('text-panel').classList.add('hidden');
        },
        openFile: function () {
          TextSend.hide();
          Main.clickFileInput();
        },
        paste: function () {
          var ta = document.getElementById('text-input');
          if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(function (t) {
              if (t) { ta.value = t; }
            }).catch(function () { ta.focus(); });
          } else {
            ta.focus();
          }
        },
        send: function () {
          if (!wasmReady()) {
            alert('编码器还在加载,请稍候再试…');
            return;
          }
          var text = document.getElementById('text-input').value;
          if (!text) { return; }
          // 纯文本 = UTF-8 字节流包成文件喂给编码器;接收端识别出纯文本会自动进剪贴板
          var bytes = new TextEncoder().encode(text);
          Main.importFile(new File([bytes], 'clipboard.txt', { type: 'text/plain' }));
          // 发完清空,避免下次打开面板残留旧文本误发
          document.getElementById('text-input').value = '';
          TextSend.hide();
        }
      };
    }();
  </script>

  <script type="text/javascript">
    var canvas = document.getElementById('canvas');
    if (!Main.init_ww(canvas)) {
      var Module = {};
      Module.canvas = canvas;
      Module.onRuntimeInitialized = () => {
        Main.init(canvas);
      };
    }
  </script>
  <script src="cimbar_js.2026-07-13T0523.js"></script>

  <script type="text/javascript">
    Main.check_GL_enabled();
  </script>

</body>

</html>
